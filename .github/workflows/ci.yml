# Covers the Electron app only. The native companion's suite is not run here
# because it targets a macOS release newer than the one GitHub's runners
# provide, so it could only ever report a failure that says nothing about the
# code. It is run locally with `xcodebuild test` — see AGENTS.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
